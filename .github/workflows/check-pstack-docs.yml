name: Check pstack docs

on:
  pull_request:
    paths:
      - "pstack/**"
      - "scripts/check-pstack-docs.mjs"
      - ".github/workflows/check-pstack-docs.yml"
  push:
    branches: [main]
    paths:
      - "pstack/**"
      - "scripts/check-pstack-docs.mjs"
      - ".github/workflows/check-pstack-docs.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check README and guide against the tree
        run: node scripts/check-pstack-docs.mjs
